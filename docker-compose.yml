services:
  hive:
    image: apache/hive:4.0.0
    container_name: hiveserver2
    environment:
      SERVICE_NAME: hiveserver2
    ports:
      - "10000:10000"   # HiveServer2 (JDBC / PyHive)
      - "10002:10002"   # HiveServer2 web UI
    volumes:
      - ./data:/data:ro
      - ./hive:/hive_scripts:ro
